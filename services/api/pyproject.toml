[project]
name = "recruitment-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=25.1.0",
  "azure-storage-blob>=12.31.0",
  "email-validator>=2.3.0",
  "fastapi>=0.115",
  "httpx>=0.28.1",
  "openpyxl>=3.1.5",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pypdf>=6.20.0",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.32",
  "recruitment-contracts",
  "recruitment-scoring",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
recruitment-contracts = { workspace = true }
recruitment-scoring = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
